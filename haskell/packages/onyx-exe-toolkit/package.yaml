name: onyx-exe-toolkit
version: '20251011'
github: mtolly/onyx
author: Michael Tolly <miketolly@gmail.com>
category: Distribution
license: GPL-3
license-file: ../../LICENSE.txt
build-type: Custom

extra-source-files:
- ../../icon/icon.*
- cbits/*.h
- cbits/*.cpp

ghc-options: -Wall

custom-setup:
  dependencies:
  - Cabal
  - base
  - process
  - filepath

executables:

  onyx:
    source-dirs: src
    main: Main.hs
    other-modules:
    - Onyx.GUI
    - Onyx.GUI.Batch
    - Onyx.GUI.Binding
    - Onyx.GUI.Core
    - Onyx.GUI.Misc
    - Onyx.GUI.Song
    - Onyx.GUI.Util
    - Paths_onyx_exe_toolkit
    c-sources:
    - cbits/time_monotonic.c
    cxx-sources:
    - cbits/hs_gl_window.cpp
    - cbits/Fl_Center.cpp
    - cbits/hs_scrubber.cpp
    - cbits/hs_dnd_button.cpp
    - cbits/hs_dnd_group.cpp
    - cbits/hs_dnd_box.cpp
    - cbits/hs_tree.cpp
    - cbits/Fl_Simple_Terminal.cpp
    include-dirs:
    - cbits

    dependencies:
    - base
    - inline-c
    - inline-c-cpp
    - directory
    - aeson
    - text
    - bytestring
    - unordered-containers
    - filepath
    - yaml
    - process
    - resourcet
    - hsndfile
    - transformers
    - data-default-class
    - stm
    - req
    - midi
    - event-list
    - containers
    - time
    - non-negative
    - binary
    - random
    # - tcp-streams
    # - io-streams
    - fsnotify
    - gl
    - async
    - network
    - exceptions
    - extra
    - JuicyPixels
    - hashable
    - optics
    - vector
    # my libraries
    - midi-util
    - conduit-audio
    # local
    - onyx-lib
    - onyx-lib-game
    - onyx-handle

    extra-libraries:
    - stdc++
    # everything for fltk is added via Setup.hs running fltk-config
    
    cxx-options: -std=c++11

    ghc-options: -threaded -O -with-rtsopts=-N

    when:
    - condition: os(mingw32)
      then:
        cpp-options: -DWINDOWS
        ld-options: ../../icon/icon.o -mwindows
        dependencies: Win32
        cxx-sources:
        - cbits/win_open_folder.cpp
        cxx-options: -std=c++11
      else:
        dependencies: mountpoints
    - condition: os(darwin)
      cpp-options: -DMACOSX
      # copied from fltkhs-hello-world, also unwind is to avoid https://gitlab.haskell.org/ghc/ghc/issues/11829
      ghc-options: "-optl-Wl,-lfltkc -optl-Wl,-keep_dwarf_unwind"

  onyx-package:
    main: Installer.hs
    dependencies: [base, nsis, text, process, containers, filepath, directory, bytestring]

  onyx-cli:
    main: CLI.hs
    dependencies: [base, onyx-lib, resourcet]
